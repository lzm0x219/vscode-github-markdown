name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      override_reason:
        description: Why the fresh upstream parity gate must be overridden
        required: false
        type: string
      override_owner:
        description: Person accountable for the override
        required: false
        type: string
      override_report_url:
        description: HTTPS URL to the reviewed parity or incident report
        required: false
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    uses: ./.github/workflows/ci.yml

  verify:
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Verify release version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $package_version"
            exit 1
          fi

          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a stable semantic version"
            exit 1
          fi

      - uses: jdx/mise-action@v4

      - run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Cache Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare release gate audit
        id: release_gate
        env:
          RELEASE_GATE_OVERRIDE_REASON: ${{ inputs.override_reason }}
          RELEASE_GATE_OVERRIDE_OWNER: ${{ inputs.override_owner }}
          RELEASE_GATE_OVERRIDE_REPORT_URL: ${{ inputs.override_report_url }}
        run: nub scripts/release/gate-index.ts prepare

      - name: Verify fresh upstream three-way parity
        id: upstream_parity
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run verify:parity:report

      - name: Enforce fresh upstream parity
        if: always()
        env:
          RELEASE_GATE_PARITY_OUTCOME: ${{ steps.upstream_parity.outcome }}
        run: nub scripts/release/gate-index.ts enforce

      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            artifacts/release-gate
            artifacts/parity
          if-no-files-found: error
          retention-days: 30

      - name: Lint
        run: nubx oxlint .

      - name: Format check
        run: nubx oxfmt --check .

      - name: Type-aware lint
        run: nubx oxlint --type-aware .

      - name: Test
        run: nub run test:coverage

      - name: Verify Markdown compatibility
        run: nub scripts/verify/index.ts

      - name: Verify Markdown parity baseline
        run: pnpm run verify:parity

      - name: Build
        run: nub run build

      - name: Generate release notes
        run: nub run release:note

      - name: Package
        run: nub run package

      - name: Verify VSIX contents and size
        run: |
          archive="$(find . -maxdepth 1 -type f -name '*.vsix' -print -quit)"
          if [[ -z "$archive" ]]; then
            echo "::error::No VSIX archive was produced"
            exit 1
          fi
          nub scripts/package-audit/index.ts \
            "$archive" \
            "$archive" \
            artifacts/package-size/release.json

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-github-markdown-${{ github.ref_name }}
          path: |
            *.vsix
            release-CHANGELOG.txt
            artifacts/package-size/release.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: vscode-github-markdown-${{ github.ref_name }}
          path: release

      - name: Login to Azure with Microsoft Entra ID
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify publisher access
        run: pnpm exec vsce verify-pat lzm0x219 --azure-credential

      - name: Publish to VS Code Marketplace
        run: pnpm exec vsce publish --packagePath release/*.vsix --azure-credential --skip-duplicate

  finalize:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vscode-github-markdown-${{ github.ref_name }}
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release/*.vsix --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --notes-file release/release-CHANGELOG.txt --draft=false --repo "$GITHUB_REPOSITORY"
